name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # アクションはコミット SHA で固定している(タグは SHA の横のコメント)。
      # 更新するときは `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` で commit SHA を確かめる(annotated tag なら git/tags/<sha> で辿る)。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml の node / pnpm を入れる。
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9 # 公開 2026-10-13（2 週間ルール）
      - run: mise run install
      - run: mise run lint
      - run: mise run test
      # デプロイ設定の dry-run。Cloudflare の認証情報は不要で、何も変更しない。
      - run: mise run deploy:check
